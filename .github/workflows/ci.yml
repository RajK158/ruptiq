name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Reads the Go version from the "go" line in go.mod, so there is
          # one place to update.
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo and a C compiler, which ubuntu-latest
      # provides. It slows tests down, so it runs as its own step after the
      # fast checks above.
      - name: Test with race detector
        run: go test -race ./...

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Reads the Go version from the "go" line in go.mod, so there is
          # one place to update.
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo and a C compiler, which ubuntu-latest
      # provides. It slows tests down, so it runs as its own step after the
      # fast checks above.
      - name: Test with race detector
        run: go test -race ./...

  # Builds the checkout demo images, starts them with compose.yaml, and runs
  # real HTTP checkout scenarios against the containers. Independent of the
  # Go job above, so the two run in parallel.
  docker-checkout:
    name: Docker checkout integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Show Docker, Compose, curl, and jq versions
        run: |
          docker version
          docker compose version
          curl --version | head -n 1
          jq --version

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      # --wait polls the health checks in compose.yaml and fails if a service
      # exits or is not healthy within the timeout.
      - name: Start services and wait until healthy
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Show service status
        run: docker compose ps

      - name: Run checkout smoke test
        run: bash scripts/checkout-smoke-test.sh

      # Diagnostics after any failure above. Each command runs even if an
      # earlier one fails, so as much state as possible is printed; the job
      # has already failed and stays failed.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::docker compose ps --all"
          docker compose ps --all || echo "docker compose ps failed"
          echo "::endgroup::"
          echo "::group::Health check results"
          for id in $(docker compose ps --all --quiet); do
            docker inspect --format '{{.Name}}: {{.State.Status}}, exit {{.State.ExitCode}}, health {{json .State.Health}}' "$id" \
              || echo "docker inspect $id failed"
          done
          echo "::endgroup::"
          echo "::group::docker compose logs"
          docker compose logs --no-color --timestamps || echo "docker compose logs failed"
          echo "::endgroup::"

      - name: Shut down and clean up
        if: always()
        run: docker compose down --volumes --remove-orphans --rmi all

  # Real k6, a loopback regression lab, and ruptiq-pair. Independent of the
  # Go and Docker jobs. Saved reports stay in a temporary directory and are
  # not uploaded.
  guided-workflow:
    name: Guided workflow integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # k6 v2.3.0, the version used for the recorded local runs. Both
      # checksums were checked against the official GitHub release assets.
      # The job fails if either published digest differs from these pins.
      - name: Install pinned k6 v2.3.0
        run: |
          set -euo pipefail
          version=v2.3.0
          checksums_url="https://github.com/grafana/k6/releases/download/${version}/k6-${version}-checksums.txt"
          tarball="k6-${version}-linux-amd64.tar.gz"
          tarball_url="https://github.com/grafana/k6/releases/download/${version}/${tarball}"
          checksums_sha256=8ebbfcd5a13d68ac67d488c2b5f28bf901ea22d2fbbfb15f5345d65c39163be2
          tarball_sha256=39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1
          curl -fsSL "$checksums_url" -o k6-checksums.txt
          echo "${checksums_sha256}  k6-checksums.txt" | sha256sum -c -
          published="$(awk -v file="$tarball" '$2 == file { print $1 }' k6-checksums.txt)"
          if [[ "$published" != "$tarball_sha256" ]]; then
            echo "published tarball checksum does not match the pinned digest" >&2
            exit 1
          fi
          curl -fsSL "$tarball_url" -o "$tarball"
          echo "${tarball_sha256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball"
          mkdir -p "$HOME/bin"
          install "k6-${version}-linux-amd64/k6" "$HOME/bin/k6"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Show Go and k6 versions
        run: |
          go version
          k6 version

      - name: Check smoke-test script
        run: |
          bash -n scripts/guided-workflow-smoke-test.sh
          bash scripts/guided-workflow-smoke-test.sh self-check

      - name: Run guided workflow smoke test
        run: bash scripts/guided-workflow-smoke-test.sh
